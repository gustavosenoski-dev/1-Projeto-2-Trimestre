<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
        /* Estilos globais ou para o corpo da página */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #F4F4F4;
        }

        /* Estilização do cabeçalho */
        header {
            background-color: #183C63;
            color: #FFFFFF;
            text-align: center;
            padding: 20px;
        }

        /* Estilização do conteúdo principal */
        main {
            background-color: #FFFFFF;
            color: #183C63;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        /* Ajuste fino para o nome do autor */
        .autor {
            font-style: italic;
            color: #555555;
        }
    </style>
</head>
<body>

    <header>
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
    </header>

    <main>
        <h2>Meu primeiro post</h2>
        <p class="autor">Por: Marcelo Paludetto</p>
        <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>
    </main>

</body>
</html>
